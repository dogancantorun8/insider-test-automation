apiVersion: v1
kind: Service
metadata:
  name: chrome-node-service
  namespace: test-automation
  labels:
    app: chrome-node
spec:
  type: ClusterIP  # Cluster ici erisim
  selector:
    app: chrome-node  # Bu etiketle eslesen Pod'lara trafik yonlendir
  ports:
  - name: selenium  # Selenium WebDriver portu (ZORUNLU)
    port: 4444
    targetPort: 4444
    protocol: TCP
  sessionAffinity: None  # Her istek farkli Pod'a gidebilir (load balancing)

