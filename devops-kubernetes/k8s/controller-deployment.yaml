apiVersion: apps/v1 # bu manifesti apply etmiyorum CrashLoopBackOff sorunu oldu
kind: Deployment
metadata:
  name: test-controller
  namespace: test-automation
  labels:
    app: test-controller
spec:
  replicas: 1  # Controller should have only 1 replica
  selector:
    matchLabels:
      app: test-controller
  template:
    metadata:
      labels:
        app: test-controller
    spec:
      serviceAccountName: test-controller-sa
      containers:
      - name: test-controller
        image: dogancan4040/insider-test-controller:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: CHROME_NODE_SERVICE
          valueFrom:
            configMapKeyRef:
              name: test-config
              key: CHROME_NODE_SERVICE
        - name: CHROME_NODE_PORT
          valueFrom:
            configMapKeyRef:
              name: test-config
              key: CHROME_NODE_PORT
        - name: BASE_URL
          valueFrom:
            configMapKeyRef:
              name: test-config
              key: BASE_URL
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: test-config
              key: LOG_LEVEL
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        # Volume mount for test results
        volumeMounts:
        - name: test-results
          mountPath: /app/test_results
        # Readiness probe
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        # Liveness probe
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: test-results
        emptyDir: {}
      restartPolicy: Always

