---
# ServiceAccount: Controller Pod'un Kubernetes API'ye erisim kimliği
apiVersion: v1
kind: ServiceAccount
metadata:
  name: test-controller-sa
  namespace: test-automation

---
# Role: Controller'a verilen yetkiler (namespace bazinda)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: test-controller-role
  namespace: test-automation
rules:
- apiGroups: [""]  # Core API group (pods, services)
  resources: ["pods", "pods/log", "services", "endpoints"]
  verbs: ["get", "list", "watch"]  # Okuma yetkileri
- apiGroups: ["apps"]  # Apps API group (deployments)
  resources: ["deployments", "deployments/scale"]
  verbs: ["get", "list", "watch", "update", "patch"]  # Okuma + guncelleme yetkileri
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]  # Pod icinde komut calistirma yetkisi

---
# RoleBinding: ServiceAccount ile Role'u baglar
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: test-controller-rolebinding
  namespace: test-automation
subjects:
- kind: ServiceAccount
  name: test-controller-sa
  namespace: test-automation
roleRef:  # Hangi Role'u baglayacagimiz
  kind: Role
  name: test-controller-role
  apiGroup: rbac.authorization.k8s.io

